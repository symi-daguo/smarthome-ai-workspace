# 本地优先单机 compose。
# 镜像来源说明：
# - 当前网络可达 Docker Hub，基础服务使用官方镜像
# - 若再次遇到 Docker Hub 不可达，可替换为 ghcr.io / quay.io 镜像：
#   ghcr.io/cloudnative-pg/postgresql:18（注意：该镜像需 operator 调度，不能直接 compose 运行）、

# 日志轮转（全项目统一，所有容器都必须挂）。
#
# 用 local 驱动而不是 json-file：local 是 Docker 官方的稀疏二进制日志格式，
# 同样的 max-size 下实际占用更小，且默认就是有上限的。json-file 不加 options
# 时是**无上限**的，长期跑下去会把宿主磁盘悄悄撑满。
#
# 单容器上限 10m × 2 = 20MB，三个容器合计不超过 60MB。
# 这是「正常落地使用」需要保留的量级：够排查近期故障，又不会无限增长。
x-log-rotate: &log-rotate
  driver: local
  options:
    max-size: '10m'
    max-file: '2'

services:
  # pgvector 镜像内置 PostgreSQL 18 + vector 扩展（知识库 RAG 需要）
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: smarthome
      # 口令必须外部注入：写死在仓库里等于「所有自部署用户的数据库口令都一样」，
      # 而这套 compose 的部署目标是「自己的服务器 + 你的域名」——那是**有公网 IP 的机器**。
      # 生成用 `openssl rand -hex 24`：hex 只含 0-9a-f，放进 DATABASE_URL 不需要转义
      #（base64 的 `+` `/` `=` 放进 URL 要转义，容易踩坑）。
      # 注意：官方镜像只在**首次初始化**时用这个口令；已建好的库要改口令得执行
      # `ALTER USER smarthome PASSWORD '<新口令>';`，光改 .env 不会生效。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?生产必须设置 POSTGRES_PASSWORD（openssl rand -hex 24）}
      POSTGRES_DB: smarthome
    ports:
      # 只绑回环：api 容器走内部网络 db:5432，这个端口对 api 毫无必要，
      # 绑到 0.0.0.0 等于把数据库直接开到公网上。留端口只是为了让宿主能连上去
      # 跑迁移、用 psql 排查问题。
      - '127.0.0.1:5432:5432'
    volumes:
      # PG18 官方镜像要求挂载到 /var/lib/postgresql（数据存放于其下按版本命名的子目录）
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smarthome -d smarthome']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # 数据库容器同样要轮转：PostgreSQL 长时间运行会持续写连接与检查点日志，
    # 不设上限的话它是全项目最容易悄悄撑大宿主磁盘的一个。
    logging: *log-rotate


  # NestJS API：启动时自动 migrate deploy + 幂等种子
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        # 留空=官方源（CI/海外）；国内网络：NPM_REGISTRY=https://registry.npmmirror.com/ docker compose build
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    environment:
      # 硬编码 production，不接受宿主 .env 覆盖。
      # 这个镜像只用于部署：main.ts 里的生产红线（拒绝默认 JWT_SECRET / 默认种子密码）
      # 与日志收敛都挂在 NODE_ENV==='production' 上，被宿主变量改成 development 会让两者一起失效。
      # 本地开发走 vite dev 直连 3080，不经过本 compose。
      NODE_ENV: production
      PORT: '3080'
      DATABASE_URL: postgresql://smarthome:${POSTGRES_PASSWORD}@db:5432/smarthome?schema=public
      JWT_SECRET: ${JWT_SECRET:?生产必须设置 JWT_SECRET（openssl rand -hex 32）}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      SEED_ADMIN_PHONE: ${SEED_ADMIN_PHONE:?生产必须设置 SEED_ADMIN_PHONE}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?生产必须设置 SEED_ADMIN_PASSWORD}
      # 模型网关 / 直连 MiniMax：env 由宿主机 .env 注入；未填时 LlmService 返回 503 LLM_KEY_MISSING
      MiniMax_BASE_URL: ${MiniMax_BASE_URL:-https://api.minimaxi.com/v1}
      MiniMax_API_KEY: ${MiniMax_API_KEY:-replace-me}
      # 多模型 provider（对话 OpenAI 兼容 / 生图 minimax|openai|comfyui）；留空则回退 MiniMax
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-minimax}
      IMAGE_MODEL: ${IMAGE_MODEL:-}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      # ComfyUI：容器内的 127.0.0.1 指向 api 容器自身，本机 ComfyUI 必须走 host.docker.internal（已配 host-gateway）
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-http://host.docker.internal:8188}
      # 云端 ComfyUI（RunPod / autodl 反代 / 自建网关）需鉴权，作 Bearer token 三步全带；本机直连留空
      COMFYUI_API_KEY: ${COMFYUI_API_KEY:-}
      COMFYUI_WORKFLOW_PATH: ${COMFYUI_WORKFLOW_PATH:-/repo/comfyui-workflow.json}
      COMFYUI_PROMPT_NODE: ${COMFYUI_PROMPT_NODE:-6}
      COMFYUI_NEGATIVE_NODE: ${COMFYUI_NEGATIVE_NODE:-7}
      COMFYUI_LATENT_NODE: ${COMFYUI_LATENT_NODE:-5}
      COMFYUI_SEED_NODE: ${COMFYUI_SEED_NODE:-3}
      # 生视频 provider：minimax（默认，Director）| openai（Sora videos API）
      VIDEO_PROVIDER: ${VIDEO_PROVIDER:-minimax}
      VIDEO_MODEL: ${VIDEO_MODEL:-}
      VIDEO_BASE_URL: ${VIDEO_BASE_URL:-}
      VIDEO_API_KEY: ${VIDEO_API_KEY:-}
      # 外部知识库联动（WeKnora / Obsidian，客户本机部署后经 host.docker.internal 访问）
      KNOWLEDGE_PROVIDER: ${KNOWLEDGE_PROVIDER:-none}
      KNOWLEDGE_ENABLED: ${KNOWLEDGE_ENABLED:-true}
      WEKNORA_BASE_URL: ${WEKNORA_BASE_URL:-http://host.docker.internal:8080/api/v1}
      WEKNORA_API_KEY: ${WEKNORA_API_KEY:-}
      WEKNORA_KB_IDS: ${WEKNORA_KB_IDS:-}
      OBSIDIAN_BASE_URL: ${OBSIDIAN_BASE_URL:-http://host.docker.internal:27124}
      OBSIDIAN_API_KEY: ${OBSIDIAN_API_KEY:-}
      # 方案讲解音频：外部语音合成服务（可插拔）。
      # 留空 NARRATION_TTS_URL = 本部署不出讲解音频（交付包自动降级为三件套，功能不受影响）。
      # 容器内 127.0.0.1 指向 api 容器自身，本机服务必须走 host.docker.internal（已配 host-gateway）。
      # 超时按讲稿长度给：实测约每千字 120 秒（839 字 105 秒、1421 字 173 秒），
      # 60000 会在长讲稿上必然失败，故默认 300000。
      NARRATION_TTS_URL: ${NARRATION_TTS_URL:-}
      NARRATION_TTS_TOKEN: ${NARRATION_TTS_TOKEN:-}
      NARRATION_TTS_TIMEOUT_MS: ${NARRATION_TTS_TIMEOUT_MS:-300000}
      # 部署级品牌：产品名与图标（白标）。留空 = 用内置默认，改完重启容器即生效，不必重建镜像。
      # BRAND_NAME=我的智能家居工作台
      # BRAND_LOGO_URL=/branding/logo.svg
      BRAND_NAME: ${BRAND_NAME:-}
      BRAND_LOGO_URL: ${BRAND_LOGO_URL:-}
      # 生成产物本地落盘目录（容器内路径，宿主机卷持久化）
      UPLOAD_DIR: /repo/uploads
      # 磁盘治理：产物配额（MB，个人中心可查看占用并一键清理过期未引用产物）+ 限流可配
      UPLOAD_QUOTA_MB: ${UPLOAD_QUOTA_MB:-4096}
      RATE_LIMIT_GLOBAL: ${RATE_LIMIT_GLOBAL:-300}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-10}
    volumes:
      - api-uploads:/repo/uploads
      # ComfyUI 工作流文件（宿主机导出后挂载进容器；文件不存在也不报错，用到时再校验）
      - ${COMFYUI_WORKFLOW_HOST_FILE:-./comfyui-workflow.json}:/repo/comfyui-workflow.json:ro
    # 容器内访问宿主机服务（ComfyUI / WeKnora / Obsidian Local REST API）
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      # 只绑回环：前端容器走内部网络反代 /api，这个端口对部署毫无必要。
      # 绑到 0.0.0.0 等于绕过前端的 nginx（限流与日志都挂在那一层）。
      - '127.0.0.1:3080:3080'
    logging: *log-rotate
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 前端：Nginx 托管静态资源并同源反代 /api 到 api 容器（宿主 5173 -> 容器 80）
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # 留空=官方源（CI/海外）；国内网络：NPM_REGISTRY=https://registry.npmmirror.com/ docker compose build
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    ports:
      - '5173:80'
    logging: *log-rotate
    depends_on:
      - api
    restart: unless-stopped



volumes:
  pgdata:
  api-uploads:
