name: CI

# 触发时机：主干推送 + 面向主干的 PR。
# 为什么必须要有：仓库此前零 CI，「本地门禁全绿」无法证明别人克隆下来也能构建。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的重复推送只留最新一次，省 Actions 配额
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: 门禁（typecheck + build + smoke）
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # smoke 跑的是 dist/ 里的编译产物，要真库。
    # 必须用 pgvector 镜像：历史迁移里有 CREATE EXTENSION vector，普通 postgres 镜像会失败。
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: smarthome
          POSTGRES_PASSWORD: smarthome
          POSTGRES_DB: smarthome
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smarthome -d smarthome"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # 与生产同口径：生产红线（JWT_SECRET / 默认密码）必须真的被拦住，
      # 用 development 环境跑等于把这道闸门绕过去了。
      NODE_ENV: production
      DATABASE_URL: postgresql://smarthome:smarthome@localhost:5432/smarthome?schema=public
      # 仅供 CI 使用的占位值：不是密钥、不进任何交付物
      JWT_SECRET: ci-only-not-a-real-secret-0000000000000000
      SEED_ADMIN_PHONE: '13800000000'
      SEED_ADMIN_PASSWORD: CiOnlyNotADefaultPassword
      CORS_ORIGIN: http://localhost:5173
      PUBLIC_ORIGIN: http://localhost:5173
      RATE_LIMIT_AUTH: 1000

    steps:
      - uses: actions/checkout@v7

      # pnpm/setup 是 pnpm/action-setup 的**官方后继者**（后者已标记为只服务 pnpm v10 及更早）。
      # 它一个步骤装好 pnpm + Node 运行时 + store 缓存，不再需要单独的 setup-node。
      # version 省略 → 读 package.json 的 packageManager 字段（pnpm@11.28.6），避免两处漂移。
      # install: false → 安装步骤由我们自己控制（要按 filter 只装需要的包）。
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: false

      - name: 安装依赖
        # 只装门禁要用的两个包：desktop 的依赖里含内嵌 PostgreSQL 的四个平台二进制，
        # 门禁用不上，装了纯浪费下载与构建时间。
        run: pnpm install --frozen-lockfile --filter "@app/api..." --filter "@app/web"

      - name: 生成 Prisma Client
        # Prisma 7 起不再随安装自动 generate，必须显式跑一次
        run: pnpm --filter @app/api prisma:generate

      - name: 跑数据库迁移
        run: pnpm --filter @app/api prisma:deploy

      - name: 灌种子
        # smoke 断言「公共库预置产品」，产品与品类来自种子，不灌会红
        run: pnpm --filter @app/api prisma:seed

      - name: 类型检查
        run: pnpm --filter @app/api typecheck && pnpm --filter @app/web typecheck

      - name: 文档检查
        # 相对链接失效 / 表格列数不齐 / 代码块没闭合 / 标题跳级 ——
        # 这四类在编辑器里看不出来，渲染到 GitHub 上才发现
        run: pnpm check:docs

      - name: 品牌与合规检查
        # 第三方商标标记 / 公司名 / 本机绝对路径 / 未登记外链域名 ——
        # 公开仓库必须持续证明「没有别人的东西」，不能靠人记得检查
        run: pnpm check:brand

      - name: 交付模版与 PPTX 自检
        # 交付件的两处纯逻辑回归：
        #   1. 点位清单不能被截断（少列一台设备等于那台装不装没定）
        #   2. PPTX 阴影参数不能被 pptxgenjs 原地污染（污染后 PowerPoint 整块不显示）
        run: pnpm check:templates && pnpm check:pptx

      - name: 构建
        run: pnpm --filter @app/api build && pnpm --filter @app/web build

      - name: 冒烟测试
        run: pnpm --filter @app/api smoke

  desktop:
    name: 桌面端编译（tsc）
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # 门禁只验证桌面端代码能编译，不需要 Electron 二进制（几百 MB）
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: false

      - name: 安装依赖
        # 这里不能用 gate 那样的 filter：desktop 自己的依赖里就有 electron 与
        # 四个平台的 @embedded-postgres（合计 456MB），少一个都编不过。
        # pnpm store 有缓存，第二次跑不会重复下载。
        run: pnpm install --frozen-lockfile

      - name: 脚本语法自检
        # 打包钩子（after-pack）只在 electron-builder 里才会被执行，
        # CI 里没有真实打包机会，用 node --check 至少挡住语法错误。
        # 桌面端的 scripts/ 下每个 .mjs 都过一遍 —— 新加的引擎定位与探活脚本
        # 只在 Windows job 里才会真正执行，Linux 这道闸门是它们的语法护栏。
        run: |
          for f in apps/desktop/scripts/*.mjs; do node --check "$f"; done

      - name: 编译桌面端主进程
        run: pnpm --filter @app/desktop build

      # 桌面端的运行时自证（起库→迁移→种子→登录）依赖 macOS 的内嵌 PG 二进制，
      # 只在 macOS runner 上有意义；签名与公证只能在有 Developer ID 证书的机器上做，
      # 两者都留在本机门禁里，不放到 CI。

  desktop-windows:
    name: 桌面端 Windows 打包（安装包 + zip）
    runs-on: windows-latest
    timeout-minutes: 60

    # 为什么必须单独一个 Windows runner：
    # electron-builder 的 win 目标在 macOS 上要靠 wine 交叉编译 ——
    # wine 装不稳、签名工具链在 wine 下也容易翻车。CI 的 Windows runner 是原生环境。
    #
    # 产物只作为 CI artifact 上传，不自动发 Release：
    # 本项目没有 Windows 代码签名证书，未签名安装包会触发 SmartScreen 提示，
    # 直接挂到 Release 上客户会以为是坏包。签名要用客户自己的证书。
    #
    # 注意：Windows 版不跑 verify:signature —— 那道闸门校验的是 codesign 封印，
    # 是 macOS 专属机制。Windows 的等价检查是「安装包能不能真的跑起来」，
    # 由下面 verify:runtime 覆盖。

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: false

      - name: 安装依赖
        # 必须全量安装：桌面端运行时要把 api 的编译产物、web 的产物、
        # Prisma Client 与生产依赖一起裁进 runtime/，少装一个包都编不出能跑的安装包。
        # pnpm store 有缓存，第二次跑不会重复下载。
        run: pnpm install --frozen-lockfile

      - name: 探活 Prisma 引擎源
        # schema engine 要从 binaries.prisma.sh 下载。@prisma/engines 的 postinstall
        # 在 Windows 上**没被执行**（安装日志里有 prisma preinstall，没有 engines postinstall），
        # 而它自己的下载又是 failSilent 的 —— 失败一个字都看不到。
        # 这一步把「源通不通」「postinstall 跑没跑」「引擎在不在」变成明面上的信号，
        # 不用翻几千行安装日志去猜。prepare-runtime 自己也会兜底下载。
        run: node apps/desktop/scripts/check-engine-source.mjs

      - name: 生成 Prisma Client
        # Prisma 7 起不再随安装自动 generate
        run: pnpm --filter @app/api prisma:generate

      - name: 编译 API 与前端
        run: pnpm --filter @app/api build && pnpm --filter @app/web build

      - name: 编译桌面端主进程
        run: pnpm --filter @app/desktop build

      - name: 准备运行时（内嵌 PG + 生产依赖）
        run: pnpm --filter @app/desktop prepare:runtime

      - name: 运行时自证（起库→迁移→种子→登录）
        # 与 macOS 同一条门禁：证明裁剪后的 runtime 在 Windows 上真的能起内嵌 PG。
        # 这一步不过，安装包发出去也是跑不起来的 —— 宁可 job 红，不发跑不起来的包。
        run: pnpm --filter @app/desktop verify:runtime

      - name: 构建 Windows 安装包
        # if: always() —— 运行时自证失败时也要把包装出来。
        # 原因：自证失败本身要让 job 变红（门禁语义不变，不能被当成通过），
        # 但产物仍要留着，好让人当场比对「装不上」到底卡在哪。
        # 没产物就只剩一条红叉，连问题长什么样都看不见。
        if: always()
        run: pnpm --filter @app/desktop exec electron-builder --win

      - name: 校准产物名
        # 同上：自证失败时也要跑，否则连产物名对不对都无从查起。
        if: always()
        # 产物名必须纯 ASCII：GitHub 会剥掉资产名里的中文，
        # 传上去再被改名就找不到对应文件了。
        #
        # 只看 release **顶层**的文件，不要 -Recurse：
        # 递归会把 win-unpacked\ 里的 app 主程序（智能家居AI工作台.exe）
        # 和内嵌 PostgreSQL 的 initdb.exe / postgres.exe 一起扫进来，
        # 那些是程序内部文件、名字带中文是正常的 —— 一扫就误判失败。
        # 真正的安装包由 win.artifactName 命名，天然是 ASCII。
        shell: pwsh
        run: |
          $files = Get-ChildItem apps/desktop/release -File | Where-Object { $_.Extension -in '.exe', '.zip' }
          if (-not $files) { throw "没有产出 Windows 安装包" }
          foreach ($f in $files) {
            if ($f.Name -match '[^\x00-\x7F]') { throw "产物名含非 ASCII 字符：$($f.Name)" }
            "{0,12:N0}  {1}" -f $f.Length, $f.Name
          }

      - name: 上传安装包
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
          if-no-files-found: error
          retention-days: 14

  # 把 Windows 产物直接推到 Release。
  #
  # 为什么不让本机下载再上传：600MB 走本机代理实测只有 60~250KB/s，
  # 单连接要 1 小时、并发分片也快不了多少（代理链路本身是瓶颈，
  # 多次实测中途断流要重下）。CI runner 在 GitHub 内网，直传是秒级。
  # 同样的道理，macOS 产物留在本机上传 —— 签名与公证只能用本机证书做。
  release-windows:
    name: 上传 Windows 产物到 Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: desktop-windows
    # 往 Release 推资产要写权限（仓库默认已设为 write，这里显式声明一次，
    # 免得以后有人把仓库设置改回只读时 job 静默失败）
    permissions:
      contents: write
    # 打包失败就别发空资产给客户
    if: needs.desktop-windows.result == 'success'
    env:
      # 版本号放在仓库变量里，不写死在 workflow 里 —— 发新版只改变量
      RELEASE_TAG: ${{ vars.RELEASE_TAG }}
    steps:
      - name: 取回 Windows 安装包
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: release-assets

      - name: 推送到 Release（同名资产已存在则跳过）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then
            echo "未设置 RELEASE_TAG 仓库变量，本次不发布"
            exit 0
          fi
          # 不用 gh 命令：它靠 git remote 推断仓库，在 CI 里会踩坑
          # （实测报「Release 不存在」，而同一个 Release 本机查得到）。
          # curl + 显式路径最稳，少一层猜。
          api="https://api.github.com/repos/$GH_REPO"
          auth="Authorization: Bearer $GH_TOKEN"
          if ! curl -sf -H "$auth" -H "Accept: application/vnd.github+json" \
               "$api/releases/tags/$RELEASE_TAG" -o /tmp/release.json; then
            echo "查不到 Release $RELEASE_TAG，跳过。原始响应："
            curl -s -H "$auth" -H "Accept: application/vnd.github+json" \
              "$api/releases/tags/$RELEASE_TAG" | head -5
            exit 0
          fi
          rid=$(jq -r '.id' /tmp/release.json)
          existing=$(jq -r '.assets[].name' /tmp/release.json)
          for f in release-assets/*.exe release-assets/*.zip; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            # 幂等：同名资产已存在就跳过。重新推一个已发出去的资产，
            # 等于换掉客户已经下载过的文件。
            if printf '%s\n' "$existing" | grep -Fxq "$name"; then
              echo "$name 已存在，跳过"
              continue
            fi
            echo "上传 $name（$(stat -c%s "$f") 字节）"
            # uploads.github.com 是**一步到位**的端点：
            # 直接 POST 二进制即完成，不必先建 asset 条目。
            code=$(curl -s -o /tmp/asset.json -w '%{http_code}' -X POST \
              -H "$auth" -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "https://uploads.github.com/repos/$GH_REPO/releases/$rid/assets?name=$name")
            if [ "$code" != "201" ] && [ "$code" != "200" ]; then
              echo "上传失败 HTTP $code："
              head -5 /tmp/asset.json
              exit 1
            fi
            echo "  -> state=$(jq -r '.state' /tmp/asset.json) size=$(jq -r '.size' /tmp/asset.json)"
          done
