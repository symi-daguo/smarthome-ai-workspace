server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 显式 MIME 映射（含 PWA manifest），避免未声明扩展被当成 application/octet-stream
    # —— 0.1.29 之前默认包含 application/octet-stream；新增 types 块会替换默认表，需自带 html/css/js 等
    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js mjs;
        application/json                       json;
        application/manifest+json             webmanifest;
        image/svg+xml                         svg;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/webp                            webp;
        image/gif                             gif;
        image/x-icon                          ico;
        font/woff2                            woff2;
        font/woff                             woff;
        text/plain                            txt;
    }

    # API 同源反向代理到 api 容器（保留 /api 前缀）
    location /api/ {
        proxy_pass http://api:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # 上传（产品图/户型图/资料）：默认 1m 会把手机照片直接 413 拒掉
        client_max_body_size 12m;
    }

    # 静态资源长缓存（Vite 产物带内容哈希）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PWA manifest MIME 已在 server 顶部 types 块声明

    # SPA history 路由回退
    # index.html 绝不缓存：发版后旧页面若命中缓存会引用已失效的 hash chunk，
    # 导致 SyntaxError/ERR_ABORTED（HTML 被当 JS 返回）
    location = /index.html {
        default_type "text/html; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
