server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 显式 MIME 映射（含 PWA manifest），避免未声明扩展被当成 application/octet-stream
    # —— 0.1.29 之前默认包含 application/octet-stream；新增 types 块会替换默认表，需自带 html/css/js 等
    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js mjs;
        application/json                       json;
        application/manifest+json             webmanifest;
        image/svg+xml                         svg;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/webp                            webp;
        image/gif                             gif;
        image/x-icon                          ico;
        font/woff2                            woff2;
        font/woff                             woff;
        text/plain                            txt;
    }

    # API 同源反向代理到 api 容器（保留 /api 前缀）
    location /api/ {
        proxy_pass http://api:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长任务必须留足：生视频服务端轮询最长约 8 分钟，方案生成调模型约 4 分钟
        # 且格式异常时会重试一次（两轮）。原来的 120s 会在容器部署下把这两个功能
        # 直接掐成 502 —— 而开发模式（vite dev 不经过 nginx）完全正常，
        # 这类差异本地测不出来。
        proxy_read_timeout 800s;
        proxy_send_timeout 800s;
        # 上传（产品图/户型图/资料）：默认 1m 会把手机照片直接 413 拒掉
        client_max_body_size 12m;
    }

    # 交付包打包（POST /api/plans/{id}/package）：接收前端生成的 PPTX。
    # 必须单独放开 —— 后端 FileInterceptor 限 60MB，而上面 /api/ 只给 12m，
    # 不单独声明的话，超过 12MB 的方案包在**容器部署**下会被 413 拒掉，
    # 开发模式（vite dev 不经过 nginx）却完全正常 —— 这类差异本地测不出来。
    # 64m 为后端 60MB 留 4MB 余量（multipart 边界与表单字段）。
    # 路径**不能带尾斜杠**：带尾斜杠的前缀 location 会让 nginx 对 `/api/plans`
    # 自动发 301 补斜杠，方案列表接口在生产部署下直接跳走（实测确认）。
    # 写成 `/api/plans` 则 `/api/plans` 与 `/api/plans/{id}/...` 一并匹配。
    location /api/plans {
        proxy_pass http://api:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 收 60MB + 服务端 zip 压缩都要时间，默认 120s 会在大方案上掐断
        proxy_read_timeout 800s;
        proxy_send_timeout 800s;
        client_max_body_size 64m;
        # 不缓冲到磁盘：交付包是一次性请求，缓冲只会拖慢并占磁盘
        proxy_request_buffering off;
    }

    # 静态资源长缓存（Vite 产物带内容哈希）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PWA manifest MIME 已在 server 顶部 types 块声明

    # SPA history 路由回退
    # index.html 绝不缓存：发版后旧页面若命中缓存会引用已失效的 hash chunk，
    # 导致 SyntaxError/ERR_ABORTED（HTML 被当 JS 返回）
    location = /index.html {
        default_type "text/html; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
